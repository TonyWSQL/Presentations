name: Deploy Cloudflare Redirects

on:
  push:
    branches:
      - main
    paths:
      - 'redirects.json'

jobs:
  update-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build and Push Ruleset
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          node -e '
          const fs = require("fs");
          const redirects = JSON.parse(fs.readFileSync("redirects.json", "utf8"));
          
          // Map JSON into Cloudflare Dynamic Redirect Rule format
          const rules = redirects.map((r, index) => ({
            id: `rule_${index + 1}`,
            expression: `http.request.uri.path == "${r.from}"`,
            action: "redirect",
            action_parameters: {
              from_value: {
                status_code: 301,
                // This tells Cloudflare to construct: https:// + yourdomain.com + your new path
                expression: `concat("https://", http.host, "${r.to}")`,
                preserve_query_string: true
              }
            }
          }));

          // Send payload to Cloudflare Ruleset API
          const payload = { rules: rules };
          
          fetch(`https://cloudflare.com{process.env.CF_ZONE_ID}/rulesets/phases/http_request_dynamic_redirect/entrypoint`, {
            method: "PUT",
            headers: {
              "Authorization": `Bearer ${process.env.CF_API_TOKEN}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
          }).then(res => res.json()).then(data => {
            if (!data.success) {
              console.error("Cloudflare API Error:", JSON.stringify(data.errors));
              process.exit(1);
            }
            console.log("Redirects successfully updated on Cloudflare!");
          });
          '
