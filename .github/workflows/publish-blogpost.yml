name: Publish Blog Post to Blogger

on:
  push:
    branches: [main]
    paths:
      - "blogposts/**/*.json"
      - "blogposts/**/*.html"
      - "!blogposts/drafts/**"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit published.json back to repo

    steps:
      - uses: actions/checkout@v4

      - name: Publish all posts
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: |
          find blogposts -name "*.json" -not -name "published.json" -not -path "blogposts/drafts/*" | while read f; do
            echo "Publishing $f"
            python blogposts/publish.py "$f"
          done

      - name: Commit updated published.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f blogposts/published.json
          git add blogposts/**/*.json
          git diff --staged --quiet || git commit -m "chore: update published post index"
          git push
